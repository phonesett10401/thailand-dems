name: Web CI

# Type check + unit tests for web/ on every push to main and every pull request.
# Deployment is done by Vercel's GitHub integration (project Root Directory = web).
# Browser tests and live Supabase checks run locally: they need secrets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
